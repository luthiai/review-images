name: Reviewer image releases

on:
  push:
    tags:
      - images-*

permissions:
  contents: read

# Serialize releases across versions so their latest updates cannot race.
concurrency:
  group: images-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    if: github.repository == 'luthiai/review-images'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check publication source and unused release version
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^images-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo 'Expected images-YYYY.MM.DD.N' >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo 'Release commit must belong to the default branch history' >&2
            exit 1
          fi

          gh api 'repos/luthiai/review-images/releases?per_page=100' --paginate > "$RUNNER_TEMP/releases.json"

          if ! jq -e -s --arg version "$GITHUB_REF_NAME" 'all(.[][]; .tag_name != $version)' \
            "$RUNNER_TEMP/releases.json" > /dev/null; then
            echo 'Release already exists. Use a new version.' >&2
            exit 1
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
        platform:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo jq

      - name: Build, smoke-test, and export
        env:
          AGENT: ${{ matrix.agent }}
          ARCH: ${{ matrix.platform.arch }}
        run: bash images/build.sh "$AGENT" "$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-${{ matrix.agent }}-${{ matrix.platform.arch }}
          path: build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  bundle:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checked-*
          merge-multiple: true
          path: build/

      - name: Validate the complete file set and checksums
        run: bash images/release.sh prepare build dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-downloads
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  registry:
    needs: bundle
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checked-*
          merge-multiple: true
          path: build/

      - name: Install registry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo jq

      - name: Publish checked images and index
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash images/release.sh registry

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: registry/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: registry
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-downloads
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: registry/

      - name: Publish verified release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash images/release.sh publish

  latest:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: registry/

      - name: Install registry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq

      - name: Point latest at the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash images/release.sh latest
